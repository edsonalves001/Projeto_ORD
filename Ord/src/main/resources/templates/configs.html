<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/ico/favicon.ico" type="image/x-icon" />
    <!-- FONTS: -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Madimi+One&display=swap" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mada:wght@200..900&display=swap" rel="stylesheet" />
    <!-- CSS: -->
    <link rel="stylesheet" th:href="@{/css/configs.css}" />
    <!--COMPONENTS: -->
    <link rel="stylesheet" th:href="@{/css/components/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/components/menu.css}" />
    <title>Projeto ORD - Configurações</title>
</head>

<body>
<div class="menu-lateral">
    <a th:href="@{/}"><img th:src="@{/assets/Logotipo-Claro.webp}" alt="Logotipo claro do site Ord" /></a>
    <div class="icone-streak-vida">
        <img th:src="@{${usuarioLogado.caminhoIconPerfil}}" alt="Imagem de perfil do usuário"/>
        <div class="streak">
            <img th:src="@{/assets/ico/streak-pessoal.svg}" alt="Ícone de streak">
            <p>2</p>
        </div>
        <div class="vida">
            <img th:src="@{/assets/ico/vidas.svg}" alt="Ícone de vidas">
            <p>3</p>
        </div>
    </div>
    <nav>
        <ul>
            <a th:href="@{/home}">
                <li>Aprender</li>
            </a>
            <a th:href="@{/placar}">
                <li>Placar</li>
            </a>

            <a th:href="@{/perfil}">
                <li>Perfil</li>
            </a>
            <a th:href="@{/loja}">
                <li>Loja</li>
            </a>
            <a th:href="@{/missoes}">
                <li>Missões</li>
            </a>
            <li>Diária</li>
        </ul>
        <div class="inferior-menu">

            <ul>
                <a th:href="@{/faq}">
                    <li>Ajuda</li>
                </a>
                <a th:href="@{/configs}" id="settings">
                    <img th:src="@{/assets/ico/settings.svg}" alt="ìcone de configurações">
                    <li>Configurações</li>
                </a>
            </ul>
        </div>
    </nav>
</div>

<main>
    <header>
        <div class="conteudo-pro">
            <p>Aprenda mais rapido com o ORD Pro</p>
        </div>
        <div class="score">
            <p>120</p>
            <img th:src="@{/assets/ico/star.svg}" alt="Ícone de estrela/score">
        </div>
    </header>

    <div class="breve">
        Em breve...
    </div>
    </main>

<!-- Sistema VLibras -->

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<!-- Script import VLibras -->
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
<!-- Fim conteúdo VLibras -->
</body>

</html>
