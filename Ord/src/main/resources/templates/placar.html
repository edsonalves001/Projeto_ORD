<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link th:href="@{/assets/ico/favicon.ico}" rel="icon" type="image/x-icon" />

    <!-- FONTS: -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Madimi+One&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Mada:wght@200..900&display=swap" rel="stylesheet" />

    <!-- CSS: -->
    <link th:href="@{/css/placar.css}" rel="stylesheet" />

    <!-- COMPONENTS: -->
    <link th:href="@{/css/components/footer.css}" rel="stylesheet" />
    <link th:href="@{/css/components/header.css}" rel="stylesheet" />
    <link th:href="@{/css/components/menu.css}" rel="stylesheet" />

    <title>Projeto ORD - Placar</title>
</head>

<body>
<div class="menu-lateral">
    <a th:href="@{/}"><img th:src="@{/assets/Logotipo-Claro.webp}" alt="Logotipo claro do site Ord" /></a>
    <div class="icone-streak-vida">
        <img th:src="@{${usuarioLogado.caminhoIconPerfil}}" alt="Imagem de perfil do usuário" />
    </div>
    <nav>
        <ul>
            <a th:href="@{/home}">
                <li>Aprender</li>
            </a>
            <a th:href="@{/placar}">
                <li>Placar</li>
            </a>

            <a th:href="@{/perfil}">
                <li>Perfil</li>
            </a>
            <a th:href="@{/loja}">
                <li>Loja</li>
            </a>
            <a th:href="@{/missoes}">
                <li>Missões</li>
            </a>
            <li>Diária</li>
        </ul>
        <div class="inferior-menu">

            <ul>
                <a th:href="@{/faq}">
                    <li>Ajuda</li>
                </a>
                <a th:href="@{/configs}" id="settings">
                    <img th:src="@{/assets/ico/settings.svg}" alt="ìcone de configurações">
                    <li>Configurações</li>
                </a>
            </ul>
        </div>
    </nav>
</div>

<main>
    <header>
        <div class="conteudo-pro">
            <p>Aprenda mais rapido com o ORD Pro</p>
        </div>
        <div class="score">
            <p>120</p>
            <img th:src="@{/assets/ico/star.svg}" alt="Ícone de estrela/score">
        </div>
    </header>

    <section class="placar">
        <div class="card-placar">
            <div class="superior-placar">
                <img th:src="@{/assets/liga-prototipo.png}" alt="Escudo da liga em que os usuários estão">
                <p>Liga X</p>
            </div>
            <div class="inferior-placar">

                <div class="card-participante">
                    <div class="perfil-participante">
                        <img th:src="@{/assets/foxy.jpg}" alt="Imagem de perfil de um usuário">
                        <p>Nome</p>
                    </div>
                    <div class="streak-score">
                        <div class="streak">
                            <img th:src="@{/assets/ico/streak.svg}" alt="Ícone que representa a streak do usuário">
                            <p>3</p>
                        </div>
                        <hr>
                        <p>120</p>
                    </div>
                </div>

                <div class="card-participante">
                    <div class="perfil-participante">
                        <img th:src="@{/assets/foxy.jpg}" alt="Imagem de perfil de um usuário">
                        <p>Nome</p>
                    </div>
                    <div class="streak-score">
                        <div class="streak">
                            <img th:src="@{/assets/ico/streak.svg}" alt="Ícone que representa a streak do usuário">
                            <p>3</p>
                        </div>
                        <hr>
                        <p>120</p>
                    </div>
                </div>

                <div class="card-participante">
                    <div class="perfil-participante">
                        <img th:src="@{/assets/foxy.jpg}" alt="Imagem de perfil de um usuário">
                        <p>Nome</p>
                    </div>
                    <div class="streak-score">
                        <div class="streak">
                            <img th:src="@{/assets/ico/streak.svg}" alt="Ícone que representa a streak do usuário">
                            <p>3</p>
                        </div>
                        <hr>
                        <p>120</p>
                    </div>
                </div>

                <div class="card-participante">
                    <div class="perfil-participante">
                        <img th:src="@{/assets/foxy.jpg}" alt="Imagem de perfil de um usuário">
                        <p>Nome</p>
                    </div>
                    <div class="streak-score">
                        <div class="streak">
                            <img th:src="@{/assets/ico/streak.svg}" alt="Ícone que representa a streak do usuário">
                            <p>3</p>
                        </div>
                        <hr>
                        <p>120</p>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <div class="breve">
        Em breve...
    </div>
</main>

<footer>
    <p>© 2026 Ord - all rights reserved</p>
</footer>
</body>

</html>
